<style>
/* Layout: caderno de bolso. Cabeçalho com a marca, uma coluna de cartões, barra de abas fixa embaixo (Avisos, Pedidos, Estoque). */
:root{
  --bg:#F7F1EA; --surface:#FFFAF5; --ink:#2A1A1C; --muted:#7A6A68; --line:#E6D9CC;
  --accent:#6B1F2E; --accent-ink:#FFF7F0; --accent-soft:#F1E1DB;
  --ok:#1E7A4F; --ok-soft:#E2F1E9; --warn:#8F5A00; --warn-soft:#F8EBD0; --dev:#2F5F9E; --dev-soft:#E1EAF6; --prep:#7A4FA3; --prep-soft:#EEE6F6; --danger:#B3261E;
  --scrim:rgba(42,26,28,.45);
  --f-display:'Cormorant Garamond','Georgia',serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1213; --surface:#271A1B; --ink:#F3E9E1; --muted:#B4A39E; --line:#3D2B2C;
    --accent:#D98A98; --accent-ink:#2A1013; --accent-soft:#3A2427;
    --ok:#6CD0A0; --ok-soft:#1B2E25; --warn:#E8B85A; --warn-soft:#322815; --dev:#8DB6EC; --dev-soft:#1A2636; --prep:#C3A2E8; --prep-soft:#2A2036; --danger:#F2877F;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1213; --surface:#271A1B; --ink:#F3E9E1; --muted:#B4A39E; --line:#3D2B2C;
  --accent:#D98A98; --accent-ink:#2A1013; --accent-soft:#3A2427;
  --ok:#6CD0A0; --ok-soft:#1B2E25; --warn:#E8B85A; --warn-soft:#322815; --dev:#8DB6EC; --dev-soft:#1A2636; --prep:#C3A2E8; --prep-soft:#2A2036; --danger:#F2877F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin-inline:auto}
header.top{padding-block:20px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px 12px}
.brand{flex:none}.tl{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0}.tl .link{white-space:nowrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em}
.brand .logo{display:block;height:44px;width:auto;max-width:none;flex:none;object-fit:contain}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{filter:invert(1)}}
:root[data-theme="dark"] .brand .logo{filter:invert(1)}
.brand small{display:block;font-family:var(--f-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-block:16px 10px;align-items:center}.acoes .btn{flex:0 0 auto}
.seg.sg{margin:0 0 12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:16px 12px}
.bar h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.done{background:color-mix(in srgb,var(--line) 60%,var(--surface));border-color:var(--line);opacity:.85}.card.done .thumb{filter:grayscale(.85)}
.card.done.vprazo{background:var(--warn-soft);border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn);opacity:1}
.card.done.vpago{background:var(--ok-soft);border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok);opacity:1}
.card.done.vdev{background:var(--dev-soft);border-color:var(--dev);box-shadow:inset 4px 0 0 var(--dev);opacity:1}
.card.done.vprazo .thumb,.card.done.vpago .thumb,.card.done.vdev .thumb{filter:none}
.tg{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font:inherit;font-size:14px;font-weight:600;color:var(--ok);cursor:pointer;min-height:36px}
.tg i{position:relative;width:38px;height:22px;border:2.5px solid currentColor;border-radius:999px;flex:none;box-sizing:border-box}
.tg i:after{content:"";position:absolute;top:50%;right:3px;width:10px;height:10px;margin-top:-5px;border:2.5px solid currentColor;border-radius:50%;box-sizing:border-box}
.tg.off{color:#8a8a8a}.tg.off i:after{right:auto;left:3px}
.card.inativa{opacity:.62}
.chip.dev{background:var(--dev-soft);color:var(--dev)}
.rg{display:block;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line,#e5ddd3);background:var(--accent-soft)}
.rg b.t{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.rg .li{display:block;font-size:13px;margin:4px 0;color:var(--text,inherit)}
.rg .li em{font-style:normal;color:var(--muted)}
.rg .st{display:block;margin:6px 0}
.rg .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip.azul{background:color-mix(in srgb,#3b6ea5 14%,transparent);color:#2f5b8a}
.chip.bad{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.chip.prep{background:var(--prep-soft);color:var(--prep)}
.card.vprep{border-left:4px solid var(--prep)}
.card.clk{cursor:pointer}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 6px}

const hex32=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')};
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function tenta(f){let u;for(let i=0;i<4;i++){try{const r=await f();if(!r.error)return r;u=r.error}catch(e){u=e}await espera(300*(i+1))}throw Object.assign(new Error((u&&(u.message||u.details||u.code))||'erro'),{cause:u})}
const clean=o=>JSON.parse(JSON.stringify(o===undefined?{}:o));

/* ---------- banco ---------- */
const cache={};      // coleção -> Map(id -> data)
const subs={};       // coleção -> Set(callbacks)
const loaded={};     // coleção -> Promise
let canal=null;

const snap=col=>{const m=cache[col]||new Map();const docs=[...m.entries()].map(([id,d])=>({id,exists:true,data:()=>d}));return{docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)}};
const emit=col=>{(subs[col]||[]).forEach(cb=>{try{cb.ok(snap(col))}catch(e){console.error(e)}})};

async function carrega(col){
  if(loaded[col])return loaded[col];
  loaded[col]=(async()=>{
    const m=new Map();cache[col]=m;
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from('docs').select('id,data').eq('tenant',TENANT).eq('collection',col).order('id').range(from,from+999);
      if(error)throw error;
      data.forEach(r=>m.set(r.id,r.data||{}));
      if(data.length<1000)break;
    }
  })();
  loaded[col].catch(()=>{delete loaded[col]});
  return loaded[col];
}
function ligaTempoReal(){
  if(canal||!sb.channel)return;
  canal=sb.channel('docs-ao-vivo').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.new&&p.new.collection?p.new:p.old;if(!r||!r.collection)return;
    if(r.tenant&&r.tenant!==TENANT)return;
    const col=r.collection;if(!cache[col])return;
    if(p.eventType==='DELETE')cache[col].delete(r.id);else cache[col].set(r.id,p.new.data||{});
    emit(col);
  }).subscribe();
}
function docRef(col,id){
  id=id||rid(20);
  const ref={id,
    async get(){await carrega(col);const d=cache[col].get(id);return{id,exists:d!==undefined,data:()=>d}},
    async set(data,opt){
      await carrega(col);const novo=clean(data);
      const final=(opt&&opt.merge)?Object.assign({},cache[col].get(id)||{},novo):novo;
      await tenta(()=>sb.from('docs').upsert({tenant:TENANT,collection:col,id,data:final},{onConflict:'tenant,collection,id'}));cache[col].set(id,final);emit(col);
    },
    async update(patch){
      await carrega(col);const p=clean(patch);
      await tenta(()=>sb.rpc('doc_atualiza',{p_colecao:col,p_id:id,p_patch:p,p_remover:[]}));
      cache[col].set(id,Object.assign({},cache[col].get(id)||{},p));emit(col);
    },
    async delete(){
      await carrega(col);
      const {error}=await sb.from('docs').delete().eq('tenant',TENANT).eq('collection',col).eq('id',id);
      if(error)throw error;cache[col].delete(id);emit(col);
    }};
  return ref;
}
const db={collection(col){return{

  onSnapshot(ok,err){
    const cb={ok};(subs[col]=subs[col]||new Set()).add(cb);
    carrega(col).then(()=>{ligaTempoReal();ok(snap(col))}).catch(e=>{if(err)err(e)});
    return()=>subs[col].delete(cb);
  }}}};

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\bvernis\b/g,'verniz').trim();

function corOk(pedido,peca){const a=stemCor(pedido);if(!a)return true;const b=stemCor(peca);return !!b&&(b.includes(a)||a.includes(b))}
let _mkSig='',_mkList=[];
function marcasConhecidas(){
  const sig=S.pecas.length;if(sig!==_mkSig){_mkSig=sig;const m=new Map();for(const x of S.pecas){const b=String(x.marca||'').trim();if(b&&!m.has(norm(b)))m.set(norm(b),b)}_mkList=[...m.values()].sort((a,b)=>b.length-a.length)}
  return _mkList;
}
const PMM=new WeakMap();
function pedMarcasModelo(p){
  if(!p)return {marcas:[],modelo:''};
  const c=PMM.get(p);if(c&&c.k===(p.marcas||'')+'|'+(p.modelo==null?'~':p.modelo)+'|'+_mkSig)return c.v;
  const toks=String(p.marcas||'').split(/[,;\/]|\se\s/).map(x=>x.trim()).filter(Boolean);
  let marcas=[],modelo=String(p.modelo||'').trim();
  if(p.modelo!=null)marcas=toks;
  else{
    const resto=[];
    for(const t of toks){const n=norm(t),b=marcasConhecidas().find(m=>n.startsWith(norm(m)+' '));if(b){marcas.push(b);resto.push(t.slice(b.length).trim())}else marcas.push(t)}

}

function padNome(n,tipo,sub){
  let t=String(n==null?'':n).replace(/\s+/g,' ').trim();
  if(!t)return t;
  t=t.replace(/\bvernis\b/gi,m=>m[0]===m[0].toUpperCase()?'Verniz':'verniz');
  t=t.replace(/\bporta[ -]cart(ões|oes|ão|ao)\b/gi,(m,x)=>'Porta-cart'+x);
  let ini=NM_INICIO[String(tipo||'').trim()];
  if(ini&&ini[0]==='Bolsa'&&/^(mala|mochila)$/i.test(String(sub||'').trim()))ini=[String(sub).trim()[0].toUpperCase()+String(sub).trim().slice(1).toLowerCase(),ini[1].filter(x=>x!=='bolsa')];
  if(ini){const w=t.split(' ')[0].replace(/^[^A-Za-zÀ-ÿ]+|[^A-Za-zÀ-ÿ-]+$/g,'').toLowerCase();if(!ini[1].includes(w)){if(tipo==='Bolsa')t=t.split(' ').filter(x=>x.toLowerCase()!=='bolsa').join(' ');t=ini[0]+' '+t}}
  return t.split(' ').map((w,i)=>{
    const m=w.match(/^([^A-Za-zÀ-ÿ0-9]*)(.*?)([^A-Za-zÀ-ÿ0-9]*)$/),pre=m[1],core=m[2],pos=m[3],k=core.toLowerCase();
    let out;
    if(NM_SIGLAS[k])out=NM_SIGLAS[k];
    else if(NM_COMUNS.has(k))out=k;
    else out=core;
    if(i===0&&out)out=out[0].toUpperCase()+out.slice(1);
    return pre+out+pos}).join(' ');
}

function vnAddCod(){
  const inp=$('vn-cod');if(!inp)return;

  for(const t of toks){

const foCodKey=c=>codNorm(String(c||'').replace(/[.\s_]+/g,'-').replace(/-+/g,'-'));

function foVariantes(s){
  const out=new Set();s=String(s);
  for(let i=0;i<s.length;i++)for(const r of (FO_CONF[s[i]]||[]))out.add(parseInt(s.slice(0,i)+r+s.slice(i+1),10));

function foMesmaConsig(pref,excl,l){
  const vars=foVariantes(foNumStr(foCodKey(l.cod))),v=l.lido;

function foPorDescricao(l){
  const bruto=norm(l.desc||l.texto).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const m=/ (?:da|do|de) ([a-z0-9 ]+)$/.exec(bruto);
  const frag=m?m[1].split(' ').filter(Boolean):[],head=m?bruto.slice(0,m.index):bruto;
  const cods=frag.length?Object.entries(S.consigs).filter(([id,c])=>c&&c.nome&&frag.every(t=>norm(c.nome).split(/\s+/).some(w=>w.startsWith(t)))).map(([id,c])=>String(c.codigo||id).toUpperCase()):[];
  const palavras=head.split(' ').filter(Boolean);
  const tipoMap=[[/bols|clutch|mochila|pochete|carteira/,'Bolsa'],[/vestid|saia|blusa|calca|casaco|conjunt|camis|jaqueta|blazer|cropped|short|macac/,'Roupa'],[/sapat|sandal|bota|tenis|scarpin|mocassim|chinelo/,'Calçado'],[/oculos|armacao/,'Óculos'],[/brinco|colar|pulseira|anel|bijut/,'Bijuteria']];
  const tipo=(tipoMap.find(([re])=>re.test(head))||[])[1]||'';
  const marcas=[...new Set(S.pecas.map(x=>norm(x.marca||'')).filter(Boolean))];
  const mb=marcas.filter(mk=>(' '+head+' ').includes(' '+mk+' '));
  const alias=palavras.filter(w=>FO_ALIAS[w]).map(w=>FO_ALIAS[w]);
  const pont=[];
  for(const x of S.pecas){
    if(!pecaDisp(x))continue;
    const cc=String(x.consignanteCodigo||'').toUpperCase();
    if(frag.length&&cods.length&&!cods.includes(cc))continue;

    if(tipo&&x.tipo===tipo)s+=2;
    palavras.forEach(w=>{if(w.length>=4&&!tipoMap.some(([re])=>re.test(w))&&norm(x.nome||'').includes(w)&&!(xm&&xm.includes(w))){s+=1;idf=true}});
    if(l.lido!=null&&Math.abs(foPreco(x)-l.lido)<0.5){s+=3;idf=true}

  return {texto:String(L.texto||'').slice(0,140),cod:String(L.codigo||'').trim(),desc:String(L.descricao||'').trim(),lido,valor:lido!=null?foFmt(lido):'',duvida:!!L.duvida,motivoIA:String(L.motivo||'').slice(0,140),pecaId:null,cand:[],alt:[],escolhida:false,valorEd:false,sugerido:false,incluir:false,st:'vermelho',M:[]};

function foAvaliar(l,todas){
  const M=[];let ver=false,ama=false;
  let x=l.pecaId?byId(S.pecas,l.pecaId):null;
  l.alt=[];
  if(!x&&l.cod){
    const k=foCodKey(l.cod);
    x=S.pecas.find(p=>foKeys(p).includes(k))||null;
    if(x)l.pecaId=x.id;
    else{
      const pref=foPref(k),cons=Object.keys(S.consigs).some(c=>codNorm(c)===pref);
      ver=true;M.push('Não achei a peça '+l.cod+' no estoque.'+(cons?'':' A consignante '+pref+' não está no caderno: cadastre ela e a peça primeiro.'));
      l.cand=cons?foMesmaConsig(pref,'',l):[];
      if(l.cand.length)M.push('Pode ser uma destas?');
    }
  }else if(!x&&!l.cod){
    const r=foPorDescricao(l);l.cand=r.cand;
    if(r.cand.length===1&&r.unica){x=byId(S.pecas,r.cand[0]);l.pecaId=x.id;l.cand=[];ama=true;M.push('Sugerida pela descrição «'+(l.desc||l.texto)+'». Confira se é essa.')}
    else if(r.cand.length){ama=true;M.push('Achei '+r.cand.length+' candidatas. Escolha a certa.')}
    else{ver=true;M.push('Não achei nenhuma peça para «'+(l.desc||l.texto)+'». Procure abaixo.')}
  }
  if(x){
    l.cand=l.escolhida?[]:(l.cand||[]).filter(id=>id!==x.id&&!l.pecaId);
    if(!pecaVend(x)){ver=true;M.push('Esta peça não está disponível ('+(x.status==='vendida'?'já foi vendida'+(x.vendaCliente?' para '+x.vendaCliente:''):x.status==='devolvida'?'foi devolvida':x.status)+').')}
    else{
      const p=foPreco(x);
      if(l.lido==null&&!l.valorEd&&l.valor===''&&p>0){l.valor=foFmt(p);l.sugerido=true}
      const v=foValorNum(l);
      if(!(v>0)){ver=true;M.push(p>0?'Falta o valor.':'A peça está sem preço cadastrado e a boleta não tem valor. Informe o valor.')}
      else if(l.sugerido&&!l.valorEd){ama=true;M.push('Sem valor na boleta: usei o preço cadastrado ('+foMoney(p)+'). Confirme.')}
      else if(p>0&&Math.abs(v-p)>0.5){
        ama=true;M.push('Valor da boleta '+foMoney(v)+'. Cadastro: '+foMoney(p)+'.');
        if(l.cod&&!l.escolhida){const pref=foPref(foCodKey(l.cod));l.alt=foMesmaConsig(pref,x.id,l);if(l.alt.length)M.push('Será outra peça da mesma consignante?')}
      }
      if(l.duvida&&!l.escolhida){ama=true;M.push('Leitura em dúvida'+(l.motivoIA?': '+l.motivoIA:'')+'.')}
      if((todas||[]).some(o=>o!==l&&o.pecaId===x.id)){ama=true;M.push('Esta peça aparece em mais de uma linha.')}
    }
  }
  l.M=M;l.st=ver?'vermelho':ama?'amarelo':'verde';
  if(l.st==='vermelho')l.incluir=false;
  return l;
}

async function folhaLer(file){

  }catch(e){

async function folhaConfirmar(){
  if(!FO||!db||!FO.clientes||FO.fim)return;
  const grupos=[];
  FO.clientes.forEach(c=>{const ls=c.linhas.filter(l=>l.incluir&&l.pecaId);if(ls.length)grupos.push([c,ls])});
  if(!grupos.length){toast('Marque ao menos uma linha.');return}
  if(grupos.some(([c])=>!c.nome.trim())){toast('Falta o nome de uma cliente.');return}
  await guard('folha:fim',async()=>{
    let num=Math.max(0,...S.vendas.map(x=>+x.numero||0));
    const folhaId='f'+Date.now().toString(36),feitas=[],falhas=[],usadas=new Set();
    for(const [c,ls] of grupos){
      const its=[];
      for(const l of ls){
        const x=byId(S.pecas,l.pecaId),val=foValorNum(l);
        if(!x||!pecaVend(x)||usadas.has(x.id)||!(val>0)){falhas.push(x?codDe(x):(l.cod||l.texto));continue}
        usadas.add(x.id);
        its.push({pecaId:x.id,codigo:codDe(x),nome:tituloPeca(x),preco:foPreco(x),valor:val,consignanteCodigo:x.consignanteCodigo||'',unidade:x.qtd>1,lido:l.texto});
      }
      if(!its.length)continue;
      num+=1;
      const doc={numero:num,data:FO.data||today(),cliente:c.nome.trim(),telefone:(c.tel||'').trim(),itens:its,total:its.reduce((t,i)=>t+i.valor,0),forma:c.forma,parcelas:c.forma==='Cartão de crédito'?1:0,obs:'Baixa pela foto da boleta',origem:'folha',folhaId,criadoEm:Date.now()};
      await db.collection('vendas').doc(folhaId+'-'+num).set(doc);
      for(const i of its){
        const x=byId(S.pecas,i.pecaId);if(!x)continue;
        try{
          if(i.unidade&&x.qtd>1)await db.collection('pecas').doc(x.id).update({qtd:x.qtd-1});
          else await db.collection('pecas').doc(x.id).update({status:'vendida',vendidaEm:doc.data,vendaNumero:num,vendaCliente:doc.cliente,valorVenda:i.valor,reservada:false,reservadaPara:'',reservadaContato:'',reservadaEm:''});
        }catch(er){falhas.push(i.codigo)}
      }
      feitas.push({numero:num,cliente:doc.cliente,total:doc.total,n:its.length});
    }
    FO.fim={folhaId,feitas,falhas};folhaDesenhar();
  });
}
async function folhaDesfazer(folhaId){
  const vs=S.vendas.filter(v=>v.folhaId===folhaId);
  if(!vs.length){toast('Não achei as vendas desta boleta.');return}
  for(const v of vs){const b=(v.itens||[]).find(i=>{const x=byId(S.pecas,i.pecaId);return x&&x.pagoEm});if(b){toast('A peça '+b.codigo+' já foi paga à consignante. Ajuste em A pagar antes.');return}}

      for(const i of (v.itens||[])){
        const x=byId(S.pecas,i.pecaId)||S.pecas.find(p=>p.codigo===i.codigo);if(!x){falhou=true;continue}
        try{
          if(i.unidade)await db.collection('pecas').doc(x.id).update({qtd:(x.qtd||1)+1});

        }catch(er){falhou=true}
      }

      await db.collection('vendas').doc(v.id).delete();
    }

  });
}

async function desfazerPecas(lista){
  lista=lista.filter(x=>!x.pagoEm);if(!lista.length){toast('Estas peças já foram pagas.');return}
  const ids=new Set(lista.map(x=>x.id)),vs=new Map();
  for(const x of lista){
    await db.collection('pecas').doc(x.id).update({status:'disponivel',vendidaEm:'',pagoEm:'',vendaNumero:'',vendaCliente:'',valorVenda:'',reservada:false,reservadaPara:'',reservadaContato:'',reservadaEm:''});
    const v=S.vendas.find(v=>(v.itens||[]).some(i=>i.pecaId===x.id));if(v)vs.set(v.id,v);
  }
  for(const v of vs.values()){
    const resto=v.itens.filter(i=>!ids.has(i.pecaId));
    if(!resto.length)await db.collection('vendas').doc(v.id).delete();
    else await db.collection('vendas').doc(v.id).update({itens:resto,total:resto.reduce((t,i)=>t+valorItem(i),0)});
  }
  toast(lista.length===1?'Venda apagada. A peça voltou para Disponíveis.':lista.length+' vendas apagadas. As peças voltaram para Disponíveis.');
}

async function desfazerVenda(v){
  const bloq=v.itens.filter(i=>{const x=byId(S.pecas,i.pecaId);return x&&x.pagoEm});
  if(bloq.length){toast('A peça '+bloq[0].codigo+' já foi paga à consignante. Ajuste em A pagar antes.');return}
  await guard('venda:undo:'+v.id,async()=>{
    let falhou=false;
    for(const i of v.itens){
      const x=byId(S.pecas,i.pecaId)||S.pecas.find(p=>p.codigo===i.codigo);if(!x){falhou=true;continue}
      try{
        if(i.unidade)await db.collection('pecas').doc(x.id).update({qtd:(x.qtd||1)+1});
        else await db.collection('pecas').doc(x.id).update({status:'disponivel',vendidaEm:'',pagoEm:'',vendaNumero:'',vendaCliente:'',valorVenda:'',reservada:false,reservadaPara:'',reservadaContato:'',reservadaEm:''});
      }catch(er){falhou=true}
    }
    if(falhou){toast('Algumas peças não voltaram para o estoque. A venda foi mantida; tente de novo.');return}
    await db.collection('vendas').doc(v.id).delete();
    closeSheet();toast('Venda desfeita. As peças voltaram para Disponíveis.');
  });
}

const XFORMAS=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Crédito na loja','Outro'];
function xlsxCol(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
const xlsxEsc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function xlsxSerial(iso){const d=parseD(iso);if(!d)return null;return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000)}
/* estilos: 1 cabeçalho, 2 moeda, 3 data, 4 total moeda (negrito), 5 negrito, 6 texto com quebra */
function xlsxSheet(cab,linhas,larg,tipos,totalCols){
  const nCol=cab.length;let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="16"/><cols>'+larg.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>';
  x+='<row r="1" ht="22" customHeight="1">'+cab.map((c,i)=>'<c r="'+xlsxCol(i)+'1" s="1" t="inlineStr"><is><t>'+xlsxEsc(c)+'</t></is></c>').join('')+'</row>';
  linhas.forEach((l,r)=>{
    x+='<row r="'+(r+2)+'">'+l.map((v,i)=>{
      const ref=xlsxCol(i)+(r+2),t=tipos[i];
      if(v===''||v==null)return '';
      if(t==='m')return '<c r="'+ref+'" s="2"><v>'+(+v||0)+'</v></c>';
      if(t==='d'){const n=xlsxSerial(v);return n==null?'<c r="'+ref+'" t="inlineStr"><is><t>'+xlsxEsc(v)+'</t></is></c>':'<c r="'+ref+'" s="3"><v>'+n+'</v></c>'}
      if(t==='n')return '<c r="'+ref+'"><v>'+(+v||0)+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t>'+xlsxEsc(v)+'</t></is></c>';
    }).join('')+'</row>';
  });
  if(totalCols&&linhas.length){
    const r=linhas.length+2;
    x+='<row r="'+r+'">'+cab.map((c,i)=>i===0?'<c r="A'+r+'" s="5" t="inlineStr"><is><t>TOTAL</t></is></c>':totalCols.includes(i)?'<c r="'+xlsxCol(i)+r+'" s="4"><f>SUM('+xlsxCol(i)+'2:'+xlsxCol(i)+(r-1)+')</f></c>':'').join('')+'</row>';
  }
  x+='</sheetData><autoFilter ref="A1:'+xlsxCol(nCol-1)+(linhas.length+1)+'"/></worksheet>';
  return x;
}

function consigsMes(mes){
  const g={};
  for(const x of S.pecas){
    const cod=String(x.consignanteCodigo||'').toUpperCase();
    if(!cod||PROPRIAS.includes(cod))continue;
    const e=g[cod]||(g[cod]={cod,nome:'',vend:[],pagas:[],aberto:[],disp:[]});
    const rc=rotuloConsig(x)||x.consignante;if(rc&&(!e.nome||e.nome.length<rc.length))e.nome=rc;
    if((x.status||'disponivel')==='vendida'){
      if(noMes(x.vendidaEm,mes))e.vend.push(x);
      if(x.pagoEm){if(noMes(x.pagoEm,mes))e.pagas.push(x)}else e.aberto.push(x);
    }else if(pecaVend(x))e.disp.push(x);
  }
  return Object.values(g).filter(e=>e.vend.length||e.pagas.length||e.aberto.length).map(e=>{
    const c=CSx(e.cod)||{};
    e.nomeS=c.nome||String(e.nome).replace(/\s*\([^)]*\)\s*$/,'')||e.cod;
    e.tel=c.telefone||c.celular||'';
    const soma=(l,f)=>l.reduce((t,x)=>t+(+f(x)||0),0);
    e.vVend=soma(e.vend,x=>x.valorVenda>0?x.valorVenda:x.preco);e.rVend=soma(e.vend,x=>x.repasse);
    e.rPago=soma(e.pagas,x=>x.repasse);e.rAberto=soma(e.aberto,x=>x.repasse);
    e.venc=e.aberto.map(vence).filter(Boolean).sort()[0]||'';
    e.eDisp=soma(e.disp,x=>x.preco);
    return e;
  }).sort((a,b)=>a.nomeS.localeCompare(b.nomeS,'pt'));
}

/* ---------- etiquetas adesivas (grande 4,5 x 4 cm e pequena 4 x 2 cm) ---------- */
const ETQ_PEQ=['Óculos','Bijuteria','Joia'];
const etqTam=x=>ETQ_PEQ.indexOf(x.tipo)>=0?'P':'G';
let ET=null;
function etqNome(x){let nm=String(x.nome||x.tipo||'Peça');if(x.marca&&norm(nm).startsWith(norm(x.marca)))nm=nm.slice(String(x.marca).length).replace(/^[\s\-–:]+/,'')||nm;return nm}
const ETQ_PIT=48,ETQ_X0=(210-(4*48-3))/2;
function etqLayout(G,P,iniG,iniP){
  /* G e P: listas de peças. Tudo numa grade única: colunas a cada 48 mm; faixas de 40 mm (grande) ou 20 mm (pequena).
     Sobras da última faixa de grandes recebem pequenas empilhadas, e pequenas e grandes dividem a mesma folha. */
  const COLS=4,PIT=48,X0=(210-(COLS*PIT-3))/2,GAP=3,TOPM=9.5,BOT=297-9.5;
  const g=Array(Math.max(0,(iniG||1)-1)).fill(null).concat(G),pq=Array(Math.max(0,(iniP||1)-1)).fill(null).concat(P);
  const out=[];let pg=[],y=TOPM;
  const faixa=h=>{if(y+h>BOT+0.01){out.push(pg);pg=[];y=TOPM}const y0=y;y+=h+GAP;return y0};
  for(let k=0;k<g.length;k+=COLS){
    const y0=faixa(40),row=g.slice(k,k+COLS);
    row.forEach((x,c)=>{if(x)pg.push({x,sz:'G',X:X0+c*PIT,Y:y0,W:45,H:40,by:y0,bh:40})});
    const vazios=COLS-row.length;
    for(let c=row.length;c<COLS&&pq.length&&k+COLS>=g.length;c++){
      for(let h=0;h<2&&pq.length;h++){const x=pq.shift();if(x)pg.push({x,sz:'P',X:X0+c*PIT+2.5,Y:y0+h*20.5,W:40,H:19.5,by:y0,bh:40})}
    }
  }
  while(pq.length){
    const y0=faixa(20),row=pq.splice(0,COLS);
    row.forEach((x,c)=>{if(x)pg.push({x,sz:'P',X:X0+c*PIT+2.5,Y:y0,W:40,H:20,by:y0,bh:20})});
  }
  if(pg.length)out.push(pg);
  return out;
}
function etqClamp(doc,t,w,n){
  /* quebra em até n linhas; se não couber, termina com reticências */
  const l=doc.splitTextToSize(String(t||''),w);
  if(l.length<=n)return l;
  const r=l.slice(0,n);let u=r[n-1].replace(/[\s,;:.\-–]+$/,'');
  while(u.length>1&&doc.getTextWidth(u+'…')>w)u=u.slice(0,-1).replace(/\s+$/,'');
  r[n-1]=u+'…';return r;
}
function etqDesenha(doc,it,corte){
  const {x,sz,X,Y,W,H}=it;
  const INK=[28,22,26],MUT=[110,100,106],txt=(t,x,y,o)=>doc.text(String(t),x,y,o);
  if(corte){doc.setDrawColor(205,200,203);doc.setLineWidth(0.15);doc.roundedRect(X,Y,W,H,sz==='G'?3:2,sz==='G'?3:2,'S')}

  if(sz==='G'){

    let y=Y+6;
    if(x.marca){doc.setFont('helvetica','bold');doc.setFontSize(7.4);doc.setTextColor(...INK);txt(String(x.marca).toUpperCase(),cx,y,{align:'center',maxWidth:W-6});y+=3.8}
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...MUT);
    etqClamp(doc,etqNome(x),W-6.4,x.marca?2:3).forEach(l=>{txt(l,cx,y,{align:'center'});y+=3.1});
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...INK);
    txt(codDe(x),cx,Y+22,{align:'center'});
    doc.setDrawColor(...INK);doc.setLineWidth(0.2);doc.line(L,Y+24,R,Y+24);
    if(p>0){
      let fs=21;doc.setFont('helvetica','bold');doc.setFontSize(fs);const t=brl2.format(p);
      while(fs>11&&doc.getTextWidth(t)>W-5){fs-=.5;doc.setFontSize(fs)}
      doc.setTextColor(...INK);txt(t,cx,Y+34,{align:'center'});
    }else{
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);txt('Consulte o valor',cx,Y+32,{align:'center'});
    }

function etqMarcas(doc,pg){

  itens.forEach(it=>{const sz=it.t||etqTam(it.x);for(let i=0;i<(it.n||1);i++)(sz==='P'?P:G).push(it.x)});
  const pags=etqLayout(G,P,inicio,inicioP);

function etqSobra(nG,nP,iG,iP){
  const mk=(g,p)=>etqLayout(Array(g).fill({}),Array(p).fill({}),iG,iP).length;
  const pg=mk(nG,nP),base=Math.max(1,pg);
  let fg=0;while(fg<48&&mk(nG+fg+1,nP)<=base)fg++;

const LOCAL={};
const PADRAO=/^([A-Za-z]{2,3}\d{2})\s*-\s*(\d+)/;
const pad2=n=>String(n).padStart(2,'0');
const semNum=t=>String(t||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
function parseCodigo(c){const m=PADRAO.exec(String(c||'').trim());return m?{pref:m[1].toUpperCase(),n:parseInt(m[2],10)}:null}
function consigMap(){
  const m={};
  const add=(pref,nome,n)=>{const e=m[pref]||(m[pref]={pref,nome:'',n:0});if(nome&&!e.nome)e.nome=nome;if(n>e.n)e.n=n};
  for(const x of S.pecas){
    const pc=parseCodigo(x.codigo||x.codigoBling);
    const pref=String(x.consignanteCodigo||(pc&&pc.pref)||'').toUpperCase();
    if(!pref)continue;
    let nome=semNum(x.consignante);
    if(norm(nome)===norm(pref))nome='';
    add(pref,nome,pc&&pc.pref===pref?pc.n:0);
  }
  for(const k in LOCAL)add(k,LOCAL[k].nome,LOCAL[k].n);
  for(const p of (BI.dados.produtos||[])){const pc=parseCodigo(p.codigo);if(pc)add(pc.pref,'',pc.n)}
  for(const c of Object.values(S.consigs||{}))if(c&&c.codigo)add(String(c.codigo).toUpperCase(),c.nome,0);
  return m;
}
function acharConsig(txt,m){
  const t=String(txt||'').trim();if(!t)return null;
  const mc=/\(([A-Za-z]{2,3}\d{2})\)\s*$/.exec(t);
  if(mc&&m[mc[1].toUpperCase()])return m[mc[1].toUpperCase()];
  if(m[t.toUpperCase()])return m[t.toUpperCase()];
  const nt=norm(semNum(t));
  return Object.values(m).find(e=>e.nome&&norm(e.nome)===nt)||null;
}
function sugerirCodigo(txt){
  const m=consigMap(),e=acharConsig(txt,m);
  if(e)return {pref:e.pref,cod:e.pref+'-'+pad2(e.n+1),existe:true,n:e.n,nome:e.nome};
  const nome=semNum(txt),ps=nome.split(/\s+/).filter(Boolean);
  if(!ps.length)return null;
  const letras=w=>norm(w).replace(/[^a-z]/g,'').toUpperCase();
  let ini=(letras(ps[0])[0]||'X')+((ps.length>1?letras(ps[ps.length-1])[0]:letras(ps[0])[1])||'X');
  let max=0;
  for(const k in m){if(k.replace(/\d+$/,'')===ini){const n=parseInt(k.slice(ini.length),10);if(n>max)max=n}}
  const pref=ini+pad2(max+1);
  return {pref,cod:pref+'-01',existe:false,n:0,nome};
}

async function reduzir(file,max,q){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,(max||1280)/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',q||.85));
}

let FL=null;
const PROMPT_LOTE='Você ajuda a dona de um brechó de bolsas e acessórios a identificar fotos de peças. Olhe a imagem e responda SOMENTE com um objeto JSON, sem texto em volta: {"codigo":"","soEtiqueta":false,"tipo":"","marca":"","cor":"","nome":""}. "codigo": se houver na imagem um código escrito ou impresso no formato de duas ou três letras, dois números, hífen e número (exemplos: CM01-172, TC02-05, GA01-07), copie exatamente; senão vazio. "soEtiqueta": true se a foto mostra principalmente uma etiqueta, papel ou cartão com o código e não a peça em si. "tipo" deve ser exatamente um destes: '+TIPOS.join(', ')+' (ou vazio). "marca": só se um logo, etiqueta, ferragem ou monograma permitir identificar com segurança; senão vazio. "cor": a cor principal em português. "nome": descrição curta com modelo e material quando visíveis, sem repetir a marca. Se não tiver certeza de um campo, deixe vazio. Não invente.';
const flChave=c=>{const pc=parseCodigo(String(c||'').toUpperCase().replace(/\s+/g,''));return pc?pc.pref+'-'+pc.n:norm(c)};
const flUniverso=()=>S.pecas.filter(x=>{const st=x.status||'disponivel';return (st==='disponivel'||st==='preparacao')&&(!FL||!FL.forn||String(x.consignanteCodigo||'').toUpperCase()===FL.forn)});
function flForns(){const m={};S.pecas.forEach(x=>{const c=String(x.consignanteCodigo||'').toUpperCase();if(c&&!m[c])m[c]=(rotuloConsig(x)||x.consignante||c)});return Object.keys(m).sort().map(c=>[c,m[c]])}
function flRecalc(){if(!FL)return;FL.fotos.forEach(f=>{if(f.estado==='ok'&&f.leitura){f.cands=flCands(f.leitura);if(!f.manual){f.sel='';f.motivo=''}}});flAtribui();flDesenha();const d=$('dl-flcod');if(d)d.innerHTML=flUniverso().map(x=>'<option value="'+esc(codDe(x))+'">'+esc(tituloPeca(x))+'</option>').join('')}
const FL_STOP=new Set(['com','sem','para','dos','das','uma','uns','bolsa','couro','alca','alcas','detalhe','detalhes','modelo','tamanho'].map(w=>w.length>3?w.replace(/[aeo]s?$/,''):w));
const flPw=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=3).map(w=>w.length>3?w.replace(/[aeo]s?$/,''):w);
function flPalavras(x){const mk=new Set(flPw(x.marca));return new Set([...flPw(x.nome),...flPw(x.cor),...flPw(x.subtipo)].filter(w=>!mk.has(w)&&!FL_STOP.has(w)))}
function flIdf(){
  const df={},N=S.pecas.length||1;
  S.pecas.forEach(x=>{flPalavras(x).forEach(w=>{df[w]=(df[w]||0)+1})});
  return w=>Math.log((N+1)/((df[w]||0)+1));
}
function flCands(l){
  const U=flUniverso(),out=[];
  if(l&&l.codigo){const k=flChave(l.codigo);const x=U.find(y=>flChave(codDe(y))===k)||S.pecas.find(y=>flChave(codDe(y))===k);if(x)return [{x,score:100,cod:true}]}
  if(!l)return out;
  // palavras raras no estoque (como o nome do modelo) valem mais do que palavras comuns (como "verniz")
  const idf=flIdf(),mk=norm(l.marca),mkw=new Set(flPw(l.marca)),lw=new Set([...flPw(l.nome),...flPw(l.cor)].filter(w=>!mkw.has(w)&&!FL_STOP.has(w)));
  U.forEach(x=>{
    let sc=0;const xm=norm(x.marca),marcaOk=!!(mk&&xm&&mk===xm);
    if(mk&&xm)sc+=marcaOk?2:-4;
    if(l.tipo&&x.tipo)sc+=norm(l.tipo)===norm(x.tipo)?1:-2;
    flPalavras(x).forEach(w=>{if(lw.has(w))sc+=idf(w)});
    if(sc>=(FL&&FL.forn?2:3))out.push({x,score:Math.round(sc*10)/10,marcaOk});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,6);
}
// certo: pode vir marcada; palpite: vem marcada com aviso "confira"; dúvida: mostra as candidatas e deixa para você
function flDecide(c,fo){
  if(!c.length)return 'nada';
  if(c[0].cod)return 'certo';

function carregarImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function quebraLinhas(c,txt,max,n){
  const ps=String(txt).split(/\s+/).filter(Boolean),ls=[];let l='';
  for(const w of ps){const t=l?l+' '+w:w;if(c.measureText(t).width>max&&l){ls.push(l);l=w}else l=t}
  if(l)ls.push(l);
  if(ls.length>n){const r=ls.slice(0,n);let u=r[n-1];while(u.length>1&&c.measureText(u+'…').width>max)u=u.slice(0,-1);r[n-1]=u+'…';return r}
  return ls;
}
async function gerarImagemFeed(x,story,soLogo){
  const W=1080,H=story?1920:1350;

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  /* foto: no feed ocupa tudo; no story aparece inteira, sem cortar, sobre fundo creme (topo e rodapé livres para o Instagram) */
  let top=0;
  /* peças largas (óculos, relógios) e fotos quadradas/deitadas aparecem inteiras, sobre fundo borrado; as demais ocupam a tela toda */
  const contem=story&&(/^(óculos|oculos|relógio|relogio|carteira)$/i.test(String(x.tipo||'').trim())||img.naturalWidth/img.naturalHeight>=.85);
  if(story&&!contem){

    const k=Math.max(W/img.naturalWidth,H/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k;
    c.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  }else if(contem){
    /* fundo: a própria foto esticada e bem borrada (só as cores dela), sem usar filtro do navegador */
    try{
      const kb=Math.max(W/img.naturalWidth,H/img.naturalHeight),cw=img.naturalWidth*kb,ch=img.naturalHeight*kb;
      /* recorta a área que cobre a tela e reduz aos poucos até virar um mosaico minúsculo */
      let cur=document.createElement('canvas');cur.width=Math.round(img.naturalWidth);cur.height=Math.round(img.naturalHeight);cur.getContext('2d').drawImage(img,0,0);
      while(cur.width>40||cur.height>40){const n=document.createElement('canvas');n.width=Math.max(1,Math.ceil(cur.width/2));n.height=Math.max(1,Math.ceil(cur.height/2));const g=n.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cur,0,0,n.width,n.height);cur=n}

      c.imageSmoothingQuality='high';c.drawImage(up,(W-cw)/2,(H-ch)/2,cw,ch);
      c.fillStyle='rgba(251,249,245,.18)';c.fillRect(0,0,W,H);
    }catch(e){c.fillStyle='#FBF9F5';c.fillRect(0,0,W,H)}

    top=250+Math.round((1440-dh)/2);
    c.drawImage(img,(W-dw)/2,top,dw,dh);
  }else{
    const k=Math.max(W/img.naturalWidth,H/img.naturalHeight),dw=img.naturalWidth*k,dh=img.naturalHeight*k;
    c.drawImage(img,(W-dw)/2,-(dh-H)*(img.naturalWidth/img.naturalHeight<.7?.5:.3),dw,dh); /* foto alta: corta igual em cima e embaixo */
  }
  if(soLogo){
    /* só o selo: círculo da marca vazado (branco), a foto aparece por dentro do desenho */
    try{
      const lg=await carregarImg(LOGO.data),s0=LOGO.h/182,d=story?180:150;
      const t=document.createElement('canvas');t.width=Math.round(118*s0);t.height=Math.round(118*s0);const g=t.getContext('2d');
      g.drawImage(lg,0,0,118*s0,118*s0,0,0,t.width,t.height);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,t.width,t.height);
      const cy=story?240:50,nm=String(x.marca||'').trim();
      /* véu escuro suave no topo, para o nome da marca em branco aparecer bem em qualquer foto */
      if(story&&nm){const g=c.createLinearGradient(0,0,0,640);g.addColorStop(0,'rgba(30,20,14,.50)');g.addColorStop(.55,'rgba(30,20,14,.22)');g.addColorStop(1,'rgba(30,20,14,0)');c.fillStyle=g;c.fillRect(0,0,W,640)}
      c.drawImage(t,50,cy,d,d);
      /* nome da marca ao lado do círculo, na fonte de títulos do site */
      if(nm){
        c.save();c.fillStyle='#fff';c.shadowColor='rgba(30,20,14,.55)';c.shadowBlur=18;c.shadowOffsetY=2;c.textBaseline='middle';c.textAlign='left';
        const tx=50+d+28,maxw=W-tx-50;let fs=66;c.font='600 '+fs+'px "Cormorant Garamond", Georgia, serif';
        while(fs>34&&c.measureText(nm).width>maxw){fs-=2;c.font='600 '+fs+'px "Cormorant Garamond", Georgia, serif'}
        c.fillText(nm,tx,cy+d/2);c.restore();
      }
    }catch(e){}
    return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));
  }
  /* etiqueta creme translúcida no canto de cima: marca, nome, valor */
  const CG='"Cormorant Garamond", Georgia, serif',EP='Epilogue, system-ui, sans-serif';
  const pad=36,lw=450,tw=lw-2*pad-60;
  const kick=(x.marca||x.tipo||'').toUpperCase();

  }
  /* selo: só o círculo da marca, pequeno, no canto da etiqueta */
  try{
    const lg=await carregarImg(LOGO.data),s=LOGO.h/182;
    c.drawImage(lg,0,0,118*s,118*s,lw-pad-54,top+pad-6,54,54);
  }catch(e){}
  return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));
}
async function gerarImagemInsta(x,fmt){

  try{await Promise.all([document.fonts.load('600 70px "Cormorant Garamond"'),document.fonts.load('600 30px Inter'),document.fonts.load('700 52px Inter')])}catch(e){}
  const img=await carregarImg('https://vlrhkwbdrljrlpxmbjer.supabase.co/storage/v1/object/public/pecas/'+x.foto);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const BG='#F6EFE8',INK='#2A1A1E',AC='#6B1F2E',MUT='#7A6A6E';

  const tit=x.nome||x.tipo||'Peça';

  const temPreco=x.preco!=null&&x.preco!=='';
  c.font='600 72px "Cormorant Garamond", Georgia, serif';

  if(quebraLinhas(c,tit,MX,9).length>2){TF=60;c.font='600 '+TF+'px "Cormorant Garamond", Georgia, serif';ls=quebraLinhas(c,tit,MX,3)}
  const LH=TF+8;

  const layout=(y0,draw)=>{
    let y=y0+(story?80:60);
    c.textBaseline='alphabetic';c.textAlign='left';
    if(kick){y+=26;if(draw){c.fillStyle=MUT;c.font='600 30px Inter, system-ui, sans-serif';try{c.letterSpacing='5px'}catch(e){}c.fillText(kick,M,y);try{c.letterSpacing='0px'}catch(e){}}y+=(story?24:12)}

  c.save();c.beginPath();c.rect(0,0,W,PH);c.clip();
  c.drawImage(img,(W-dw)/2,-(dh-PH)*.3,dw,dh);c.restore();

  try{const lg=await carregarImg(LOGO.data),lh=54,lw=lh*LOGO.w/LOGO.h;c.drawImage(lg,M,fy-lh/2-4,lw,lh)}catch(e){c.fillStyle=INK;c.font='600 44px "Cormorant Garamond", Georgia, serif';c.fillText('Comadres',M,fy)}

async function bkExiste(id){try{const r=await window.fotoFetch(id);return !!r.ok}catch(e){return false}}

const bkExt=t=>/png/.test(t||'')?'png':/webp/.test(t||'')?'webp':/gif/.test(t||'')?'gif':'jpg';
async function bkCriar(){
  if(!window.JSZip)throw new Error('sem JSZip');
  bkMsg('Lendo os dados…');
  const cols=await bkLerBanco();
  const ids=new Set();
  for(const c of BK_COLS){if(c==='bling')continue;for(const id in cols[c])bkWalk(cols[c][id],x=>{if(HEX32.test(x))ids.add(x);return x})}
  const zip=new JSZip(),fotos={},ausentes=[],fila=[...ids];let feitas=0;
  const w=async()=>{while(fila.length){const id=fila.pop();const b=await bkFoto(id);feitas++;bkMsg('Copiando as fotos… '+feitas+' de '+ids.size);if(!b){ausentes.push(id);continue}const path='fotos/'+id+'.'+bkExt(b.type);zip.file(path,b,{compression:'STORE'});fotos[id]={arquivo:path,tipo:b.type||'image/jpeg'}}};
  await Promise.all([w(),w(),w(),w()]);
  const contagem={};BK_COLS.forEach(c=>{contagem[c]=Object.keys(cols[c]).length});
  const meta={formato:'comadres-backup',versao:1,criadoEm:new Date().toISOString(),contagem,fotos,fotosAusentes:ausentes};
  zip.file('dados.json',JSON.stringify({...meta,colecoes:cols}));
  zip.file('LEIA-ME.txt','Backup completo do Caderno Comadres\r\nGerado em '+new Date().toLocaleString('pt-BR')+'\r\n\r\ndados.json: todos os registros do caderno (peças, consignantes, vendas, pedidos, propostas, agenda e dados do Bling), com todos os campos.\r\nfotos/: as fotos das peças, como imagens comuns.\r\n\r\nPara voltar os dados: no caderno, toque em "Baixar backup" e depois em "Restaurar de um backup". O caderno mostra o que vai mudar e só troca os dados depois que você confirmar.\r\nGuarde este arquivo fora do celular, por exemplo no computador ou na nuvem.\r\n');
  bkMsg('Compactando…');
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  return {blob,meta};
}

async function vmAcao(a,g,i,v){
  if(!VMW)return;
  const L=VMW[g];
  if(a==='vm-cima'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
  else if(a==='vm-baixo'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
  else if(a==='vm-troca'){const [n]=L.splice(i,1);if(VMW[v])VMW[v].push(n);else L.splice(i,0,n)}
  else if(a==='vm-tira')L.splice(i,1);
  else if(a==='vm-poe'||a==='vm-add'){
    const n=String(v||'').trim();if(!n)return;
    const k=vmChave(n);['premium','media','entrada'].forEach(h=>{VMW[h]=VMW[h].filter(x=>vmChave(x)!==k)});
    VMW[g].push(n);if(a==='vm-add'){const f=$('vm-nova');if(f)f.value=''}
  }
  vmDesenha();await vmSalvar();
}

/* ---------- proteção das fotos da vitrine: tamanho menor + marca d'água do círculo da Comadres (gravada na imagem) ---------- */
const VIT_MAX=1280,VIT_Q=.82;
const VIT_MODO='sem';/* sem = só reduzir, sem marca d'água (a Tatiana não quis a marca) */
async function vitMarca(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const w0=bmp.width,h0=bmp.height,k=Math.min(1,(max||VIT_MAX)/Math.max(w0,h0));
  const W=Math.round(w0*k),H=Math.round(h0*k),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.drawImage(bmp,0,0,W,H);
  if(VIT_MODO==='sem')return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',q||VIT_Q));
  if(!LOGO||!LOGO.data)throw new Error('sem logo');
  const lg=await carregarImg(LOGO.data),ls=LOGO.h/182,sx=0,sy=0,sw=118*ls,sh=118*ls;
  const marca=(x,y,d,al)=>{c.save();c.globalAlpha=al;c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=Math.max(2,d*.12);c.drawImage(lg,sx,sy,sw,sh,x,y,d,d);c.restore()};
  /* grade bem leve por toda a foto: cortar um canto não adianta */
  const d1=Math.round(Math.min(W,H)*.11),pas=Math.round(d1*2.8);
  for(let y=Math.round(pas*.35),r=0;y<H;y+=pas,r++)for(let x=Math.round(pas*.3)+(r%2?Math.round(pas/2):0);x<W;x+=pas)marca(x,y,d1,.10);
  /* marca principal, no canto de baixo */
  const d2=Math.round(Math.min(W,H)*.15);marca(W-d2-Math.round(W*.04),H-d2-Math.round(H*.035),d2,.55);
  return await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',q||VIT_Q));
}

const vitOrdena=L=>{
  const M=vmLer(),gi=new Map();
  M.premium.forEach((m,i)=>gi.set(vmChave(m),{g:0,i}));M.media.forEach((m,i)=>gi.set(vmChave(m),{g:1,i}));M.entrada.forEach((m,i)=>gi.set(vmChave(m),{g:2,i}));

  const tp=x=>x.tipo||'Outro',AC=['Óculos','Carteira','Cinto','Lenço','Relógio','Bijuteria'];
  const fx=x=>{const k=vmChave(x.marca||'');if(!k)return 3;const r=gi.get(k);return r?r.g:2};
  const pos=x=>{const r=gi.get(vmChave(x.marca||''));return r?r.i:9999};

  const bloco=(arr,lvPrimeiro)=>{
    const m=new Map();arr.forEach(x=>{const k=vmChave(x.marca||'');if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
    const gs=[...m.entries()].map(([k,l])=>({k,l:l.sort(rec),i:pos(l[0]),nome:l[0].marca||''}));
    gs.sort((a,b)=>(lvPrimeiro?(b.k==='louisvuitton')-(a.k==='louisvuitton'):0)||b.l.length-a.l.length||a.i-b.i||a.nome.localeCompare(b.nome,'pt'));

async function bkRestaurar(){

  const j=BK.j,cols=j.colecoes;

    try{const {blob}=await bkCriar();seg=blob;await dl.save({filename:'comadres-antes-da-restauracao-'+bkHoje()+'.zip',data:blob})}
    catch(e){bkMsg('A cópia de segurança do estado atual não foi salva. Restauração cancelada: nada foi alterado.');BK.rodando=false;if(go)go.disabled=false;if(fi)fi.disabled=false;return}
    const mapa={},faltam=[];const PRIVS=new Set(Object.values(cols.comprovantes||{}).map(x=>x&&x.asset).filter(Boolean));const ids=Object.keys(j.fotos);let n=0;
    for(const id of ids){

      try{const raw=await zf.async('arraybuffer');const up=await CAP.assets.upload(new Blob([raw],{type:info.tipo||'image/jpeg'}),{id:id,privado:PRIVS.has(id),type:info.tipo||'image/jpeg'});if(up&&up.id)mapa[id]=up.id;else faltam.push(id)}catch(e){faltam.push(id)}
    }
    if(Object.keys(mapa).length)for(const c of BK_COLS){if(c==='bling')continue;for(const id in cols[c])bkWalk(cols[c][id],x=>mapa[x]||x)}
    const escrever=[],apagar=[];
    for(const c of BK_COLS){for(const id in cols[c])escrever.push([c,id]);for(const id in BK.atual[c])if(!(id in cols[c]))apagar.push([c,id])}
    let feitos=0,falhas=0;const total=escrever.length+apagar.length;
    const pool=async(lista,fn)=>{const fila=lista.slice();const w=async()=>{while(fila.length){const it=fila.shift();try{await fn(it)}catch(e){falhas++;(window.__errs=window.__errs||[]).push(String(it[0])+'/'+String(it[1])+': '+((e&&e.message)||e))}feitos++;if(feitos%10===0||feitos===total)bkMsg('Restaurando… '+feitos+' de '+total)}};await Promise.all([w(),w(),w(),w(),w(),w()])};
    BULK=true;
    try{
      await pool(escrever,([c,id])=>db.collection(c).doc(id).set(cols[c][id]));
      await pool(apagar,([c,id])=>db.collection(c).doc(id).delete());
    }finally{BULK=false;render()}
    bkArea('');
    bkMsg((falhas?'Restauração terminou com '+falhas+' erro(s). ':'Restauração concluída. ')+escrever.length+' registros gravados, '+apagar.length+' apagados.'+(faltam.length?' '+faltam.length+' foto(s) não puderam ser recolocadas.':'')+(falhas?' Primeiro erro: '+(window.__errs||[])[0]+' (quando: '+(window.__errs||[]).slice(0,3).join(' | ')+').':''));
    BK=null;
  }catch(e){bkMsg('A restauração parou por um erro. A cópia do estado anterior foi salva no seu aparelho.');if(BK)BK.rodando=false}
}

function pecasParecidas(p){
  const info=codigosDe(p),pref=info.pref;if(!pref)return [];
  const its=(p.itens||[]).filter(x=>!x.recusada&&x.nome),out=[];
  const ex=S.pecas.filter(x=>String(x.consignanteCodigo||'').toUpperCase()===pref&&['disponivel','preparacao',undefined,''].includes(x.status));
  its.forEach(it=>{
    const r=calc(it).rep,mk=norm(it.marca||'');if(!mk||!(r>0))return;
    const y=ex.find(z=>norm(z.marca||'')===mk&&(!it.tipo||!z.tipo||it.tipo===z.tipo)&&(+z.repasse>0)&&Math.abs(+z.repasse-r)/Math.max(+z.repasse,r)<0.1);
    if(y)out.push({it,y});
  });
  return out;
}

const fmtCpf=d=>{d=String(d||'').replace(/\D/g,'');if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return d};
function consigPlano(){
  const por={};
  for(const c of BI.dados.contatos){const k=String(c.codigo||'').trim().toUpperCase();if(!/^[A-Z]{2,3}\d{2,3}$/.test(k))continue;(por[k]||(por[k]=[])).push(c)}
  const novos=[],compl=[];
  for(const k in por){
    const c=por[k].sort((a,b)=>(b.det?1:0)-(a.det?1:0))[0];
    const d={codigo:k,nome:c.nome||'',telefone:c.celular||c.telefone||'',email:c.email||c.emailNf||'',cpf:fmtCpf(c.numeroDocumento),endereco:[c.endereco,c.cidade&&c.cidade!==c.endereco?c.cidade:'',c.uf&&String(c.endereco||'').indexOf(c.uf)<0?c.uf:''].filter(Boolean).join(', ')};
    const ex=S.consigs[k.toLowerCase()];
    if(!ex)novos.push(d);else if(norm(String(ex.nome||'').split(/\s+/)[0])===norm(d.nome.split(/\s+/)[0])){const add={};for(const f of ['nome','telefone','email','cpf','endereco'])if(!ex[f]&&d[f])add[f]=d[f];if(Object.keys(add).length)compl.push([k,add])}
  }
  return {novos,compl,dup:Object.values(por).filter(x=>x.length>1).length};
}

function normCodigo(c){
  let k=String(c||'').toUpperCase().replace(/[^A-Z0-9\- ]/g,'').replace(/\s+/g,'');
  const m=/^([A-Z0-9]{4})-?(\d{1,3})$/.exec(k);
  if(m){const a=m[1].replace(/(?<=^[A-Z]{2})O/,'0').replace(/(?<=^[A-Z]{2}\d?)O/,'0');if(/^[A-Z]{2}\d{2}$/.test(a))return a+'-'+pad2(+m[2])}
  return PADRAO.test(k)?k:'';
}

  for(const [k,r] of R)if(r.test(t))return k;
  return 'Outro';
}
function estoquePlano(){
  const ids=new Set(S.pecas.map(x=>String(x.blingId||'')).filter(Boolean)),cods=new Set();
  S.pecas.forEach(x=>{[x.codigo,x.codigoBling].forEach(c=>{if(c)cods.add(String(c).toUpperCase().replace(/\s+/g,''))})});
  const marcas=[...new Set(S.pecas.map(x=>String(x.marca||'').trim()).filter(m=>m.length>=3))].sort((a,b)=>b.length-a.length);
  const novos=[],duvida=[];
  for(const p of BI.dados.produtos){
    if(!(p.saldo>0)||ids.has(String(p.id)))continue;
    const bruto=String(p.codigo||'').toUpperCase().replace(/\s+/g,'');
    if(cods.has(bruto))continue;
    const cod=normCodigo(p.codigo),pc=parseCodigo(cod),pref=pc?pc.pref:'';
    if(!pref)duvida.push(p.codigo+' · '+p.nome);
    const nome=String(p.nome||'').trim(),nn=norm(nome);
    const marca=p.marca||(marcas.find(m=>nn.startsWith(norm(m)+' ')||nn===norm(m))||'');
    const forn=String(p.fornecedor||'').trim();
    novos.push({id:'bl-'+p.id,d:{blingId:p.id,codigoBling:cod||String(p.codigo||'').trim(),consignante:pref?(forn&&norm(forn)!==norm(pref)?forn+' ('+pref+')':pref):forn,consignanteCodigo:pref,nome,marca,tipo:tipoBling(nome),cor:'',tamanho:'',preco:Number(p.preco)||0,repasse:p.custo>0?Number(p.custo):null,qtd:p.saldo>1?p.saldo:1,entrada:'',status:'disponivel',origem:'bling',criadoEm:Date.now()}});
  }
  return {novos,duvida};
}
async function bEstoque(){
  if(!db||BI.rodando)return;
  const pl=estoquePlano();let ok=0,falha=0;
  BI.fim='Trazendo as peças…';render();
  const fila=pl.novos.slice();
  async function w(){while(fila.length){const x=fila.shift();try{await db.collection('pecas').doc(x.id).set(x.d);ok++}catch(e){falha++}}}
  await Promise.all([w(),w(),w()]);
  BI.fim='Pronto. '+ok+' peças em estoque trazidas do Bling'+(falha?' ('+falha+' não salvaram, toque de novo)':'')+'.'+(pl.duvida.length?' Código fora do padrão, confira: '+pl.duvida.join('; ')+'.':'');
  render();
}

function telefoneDe(t){

}

function shAtualiza(){

function icsCompromisso(t){
  const p2=n=>String(n).padStart(2,'0'),dd=t.quando.replace(/-/g,'');
  const esc2=v=>String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  let ini,fim,hh=/^(\d{1,2}):(\d{2})$/.exec(t.hora||'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Comadres//Caderno//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+t.id+'@comadres','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')];
  if(hh){const h=+hh[1],m=+hh[2],e=new Date(2000,0,1,h+1,m);L.push('DTSTART:'+dd+'T'+p2(h)+p2(m)+'00','DTEND:'+dd+'T'+p2(e.getHours())+p2(e.getMinutes())+'00')}
  else{const d=parseD(t.quando);d.setDate(d.getDate()+1);L.push('DTSTART;VALUE=DATE:'+dd,'DTEND;VALUE=DATE:'+isoD(d).replace(/-/g,''))}
  L.push('SUMMARY:'+esc2('Comadres: '+tituloLimpo(t)),'DESCRIPTION:'+esc2(($('sh-msg')&&$('sh-msg').value)||tituloLimpo(t)),'END:VEVENT','END:VCALENDAR');
  return L.join('\r\n');
}
